<div class="auth-page">
    <div class="auth-card glass-card">
        <h1>Inscription client</h1>
        <p class="subtitle">Les comptes administrateur sont créés par l’équipe (pas d’inscription publique).</p>

        <div class="form-group">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" [(ngModel)]="nom">
        </div>
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" [(ngModel)]="email" autocomplete="email">
        </div>
        <div class="form-group">
            <label class="form-label">Adresse</label>
            <input type="text" class="form-control" [(ngModel)]="adresse">
        </div>
        <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-control" [(ngModel)]="motDePasse" autocomplete="new-password">
        </div>

        <p class="error" *ngIf="error">{{ error }}</p>

        <button class="btn btn-primary btn-block" (click)="creerCompte()">S’inscrire</button>

        <p class="footer-link">
            Déjà un compte ?
            <a routerLink="/auth/login">Se connecter</a>
        </p>
    </div>
</div>
