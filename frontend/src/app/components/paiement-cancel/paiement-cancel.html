<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border-warning">
        <div class="card-body text-center">
          <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-exclamation-triangle-fill text-warning" viewBox="0 0 16 16">
              <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
            </svg>
          </div>
          
          <h2 class="text-warning mb-3">Paiement annulé</h2>
          <p class="lead">Vous avez annulé le paiement.</p>
          <p>Votre commande est toujours en attente de paiement.</p>

          <div class="d-grid gap-2 mt-4">
            <button class="btn btn-primary" (click)="retryPayment()">
              Réessayer le paiement
            </button>
            <button class="btn btn-secondary" (click)="goToCommandes()">
              Retour à mes commandes
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
