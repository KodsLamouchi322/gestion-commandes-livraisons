# ==========================================
# Configuration de la Base de Données MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_commandes_v2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Configuration JPA / Hibernate
# ==========================================
# update = crée/modifie les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Configuration du Serveur
# ==========================================
server.port=8085

# ==========================================
# Configuration Swagger
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Erreurs (messages uniquement, jamais de stacktrace exposée)
# ==========================================
server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-16-chars-longueur-suffisante}
jwt.expiration-ms=86400000

# ==========================================
# Compte administrateur créé au démarrage si absent
# ==========================================
app.admin.email=admin@gestion.com
app.admin.password=admin123

# ==========================================
# Stripe (configurer via variable d'environnement STRIPE_SECRET_KEY)
# NE JAMAIS mettre la clé secrète directement ici
# ==========================================
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# ==========================================
# Upload fichiers
# ==========================================
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Servir les fichiers uploadés comme ressources statiques
spring.web.resources.static-locations=classpath:/static/,file:uploads/
